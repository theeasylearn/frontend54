<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* class selector */
        .HighLight
        {
            border: 2px solid black;
            margin-bottom: 10px;
        }
        .bg-color
        {
            background-color: yellow;
            color:red;
        }
    </style>
</head>
<body>
    <h1>Example of class selector style</h1>
    <div class="HighLight bg-color">1</div>
    <div>2</div>
    <div class="HighLight bg-color">3</div>
    <div>4</div>
    <div class="HighLight bg-color">5</div>
</body>
</html>
