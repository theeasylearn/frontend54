<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>input related attributes</h1>
    <form action="teacher.html">
        <table border="1" align="center" cellpadding="10">
            <tr>
                <td>Enter email</td>
                <td>
                    <input type="email" name="email" autofocus multiple />
                </td>
            </tr>
            <tr>
                <td>Enter age</td>
                <td>
                    <input type="number" name="age" min="18" max="65" />
                </td>
            </tr>
            <tr>
                <td>
                    select file 
                </td>
                <td>
                    <input type="file" name="photo" accept="image/*">
                </td>
            </tr>
            <tr>
                <td>Select resume</td>
                <td>
                    <input type="file" name="resume" accept="application/pdf" />
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="teacher login" />
                    <input type="submit" value="student login" 
                    formaction="student.html" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
