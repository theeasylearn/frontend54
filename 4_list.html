<html>
<head>
    <title>
        list in html
    </title>
    <body>
        <h1>List in html</h1>
        <h2>Symbolic list</h2>
        <!-- un ordered list -->
        <ul type="disc">
            <li>HTML</li>
            <li>css</li>
            <li>Javascript</li>
        </ul>
        <h2>Numeric List</h2>
        <!-- order list -->
        <ol type="A">
            <li>HTML</li>
            <li>CSS</li>
            <li>Javascript</li>
        </ol>
        <h2>Nested List</h2>
        <ol>
            <li>India
                <ul>
                    <li>Gujarat</li>
                    <li>Maharastra</li>
                </ul>
            </li>
            <li>Russia</li>
            <li>Poland</li>
        </ol>
    </body>
</head>
</html>
