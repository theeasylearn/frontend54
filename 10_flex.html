<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section {
            display: flex;
            /* horizontal alignment works only in case of flex */
            /* justify-content: center; */
            /* justify-content:space-around; */
            /* justify-content:space-between; */
            /* justify-content:right; */
            /* vertical alignment works only in case of flex  */
            /* align-items: top;
            align-items: center; */
            align-items: end;
            background-color: antiquewhite;
            border: 2px solid black;
            height: 350px;
        }

        /* browser select only div tag which are direct child of section tag */
        section>div {
            background-color: aliceblue;
            color: blue;
            text-align: center;
            margin-bottom: 10px;
            width: 200px;

            border: 1px solid black;
            font-size: 48px;
            text-align: center;
            vertical-align: middle;
        }

        .one {
            height: 100px;
        }

        .two {
            height: 200px;
        }

        .three {
            height: 250px;
        }

        .four {
            height: 300px;
        }

        article {
            background-color: aliceblue;
            border: 2px solid black;
            height: 350px;
            display: flex;
            flex-direction: column;
        }
        article>span 
        {
            display: inline-block;
            width:200px;
            height: 100px;
            border: 2px solid black;
            font-size: xx-large;
            text-align: center;
        }
    </style>
</head>

<body>
    <div>
        <h1>Flex</h1>
    </div>
    <section>
        <div class="one">1</div>
        <div class="two">2</div>
        <div class="three">3</div>
        <div class="four">4</div>
    </section>
    <article>
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
    </article>
</body>

</html>
