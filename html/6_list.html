<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Example of list</h1>
    <hr>
    <h2>Indian states</h2>
    <!-- ul = unordered list -->
    <ul type="circle">
        <li>Gujarat</li>
        <li>Maharastra</li>
        <li>Rajasthan</li>
    </ul>
    <!-- ol = ordered list (list with numbers) -->
    <ol type="i">
        <li>Gujarat
            <ul>
                <li>Bhavnagar
                    <ol>
                        <li>Waghwadi road</li>
                        <li>Ghogha Circle</li>
                    </ol>
                </li>
                <li>Ahmedabad</li>
                <li>Rajkot</li>
            </ul>
        </li>
        <li>Maharastra</li>
        <li>Rajasthan</li>
    </ol>
</body>
</html>
